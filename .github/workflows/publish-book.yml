name: Build Engineering Intelligence

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: engineering-intelligence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run publication validator tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate AsciiDoc source graph
        run: python3 scripts/validate_sources.py

  build:
    needs: source-validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set reproducible publication time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mermaid tooling
        run: npm install --no-audit --no-fund

      - name: Install plot and plate rendering dependencies
        run: python3 -m pip install --upgrade matplotlib numpy

      - name: Configure headless Chrome for Mermaid
        run: |
          # mmdc renders through puppeteer, which needs a Chrome binary that
          # npm install does not fetch. Ubuntu runners also block unprivileged
          # user namespaces via AppArmor, so Chrome cannot sandbox and mmdc
          # dies unless it is launched with --no-sandbox.
          npx --yes puppeteer browsers install chrome-headless-shell
          mkdir -p "$HOME/.config/mermaid"
          cat >"$HOME/.config/mermaid/puppeteer-config.json" <<'PPC'
          {"args": ["--no-sandbox", "--disable-setuid-sandbox"]}
          PPC
          echo "MERMAID_PUPPETEER_CONFIG=$HOME/.config/mermaid/puppeteer-config.json" >> "$GITHUB_ENV"

      - name: Build every edition
        run: make all

      - name: Build slide decks
        run: make decks

      - name: Verify manifest source commit
        run: python3 scripts/validate_manifest.py build "$GITHUB_SHA"

      - name: Assemble the Pages site
        env:
          REPO_SLUG: ${{ github.repository }}
        run: bash scripts/build-pages.sh build site

      - name: Upload publication artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engineering-intelligence-${{ github.sha }}
          path: |
            build/engineering-intelligence.html
            build/engineering-intelligence.pdf
            build/engineering-intelligence.epub
            build/manifest.json
            build/figures/mermaid/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Download publication artifacts
        uses: actions/download-artifact@v4
        with:
          name: engineering-intelligence-${{ github.sha }}
          path: build

      - name: Revalidate downloaded release artifacts
        run: python3 scripts/validate_manifest.py build "$GITHUB_SHA"

      - name: Attach editions to tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/engineering-intelligence.html
            build/engineering-intelligence.pdf
            build/engineering-intelligence.epub
            build/manifest.json
